name: Release

# Installers for macOS, Windows and Linux cannot be cross-compiled from one
# host — each needs its own runner — so tagging is what produces a full set.
on:
  push:
    tags: ['v*']
  # Manual runs build the installers and upload them as workflow artifacts but
  # publish nothing: `tagName` below resolves to '' when the ref is not a tag,
  # which is what tells tauri-action to skip release creation.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ''
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # Artifact filenames come from tauri.conf.json's version, not from the
      # tag. Without this, tagging v0.2.0 without bumping the manifests
      # publishes a v0.2.0 release full of files named 0.1.0 - and the three
      # version fields can drift from each other just as silently. Runs before
      # anything expensive so a mismatch costs seconds, not a full matrix build.
      - name: Tag and manifest versions must agree
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          tauri=$(sed -n 's/^  "version": "\(.*\)",$/\1/p' src-tauri/tauri.conf.json)
          npm=$(sed -n 's/^  "version": "\(.*\)",$/\1/p' package.json)
          cargo=$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml)
          tag="${GITHUB_REF_NAME#v}"
          echo "tag=$tag tauri=$tauri npm=$npm cargo=$cargo"
          if [ -z "$tauri" ] || [ -z "$npm" ] || [ -z "$cargo" ]; then
            echo "::error::could not read a version field - did a manifest's formatting change?"
            exit 1
          fi
          if [ "$tauri" != "$tag" ] || [ "$npm" != "$tag" ] || [ "$cargo" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME disagrees with the manifests (tauri.conf.json=$tauri package.json=$npm Cargo.toml=$cargo). Bump all three to $tag, or retag."
            exit 1
          fi

      # 22.04 rather than 24.04: the deb it produces links against the older
      # glibc/webkit, so it installs on both. Building on 24.04 would silently
      # drop support for every 22.04 user.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf file rpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.target }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Fetch the engine for the target we are actually building, not the host —
      # they differ for the macOS cross-builds.
      - name: Fetch bundled Tectonic engine
        run: node scripts/fetch-tectonic.mjs --target ${{ matrix.target }}

      # A repo-level invariant, identical on every runner - checking it once is
      # the whole signal, and running it on all four only multiplied the ways it
      # could break (it did: pnpm is a .cmd shim on Windows and could not be
      # spawned at all).
      - name: Verify the third-party notice is current
        if: runner.os == 'Linux'
        shell: bash
        run: |
          node scripts/gen-third-party.mjs
          if ! git diff --quiet -- THIRD-PARTY-LICENSES.md; then
            echo "::error::THIRD-PARTY-LICENSES.md is stale. Run 'pnpm run licenses' and commit the result."
            git diff -- THIRD-PARTY-LICENSES.md | head -60
            exit 1
          fi

      - run: pnpm test
      - run: pnpm exec svelte-check --threshold error
      # Explicitly targeted: on the x86_64 macOS leg the host triple is
      # aarch64 (macos-latest is Apple Silicon), so an untargeted build asks
      # tauri-build for the aarch64 sidecar, which this job never fetched.
      # Targeting also means the checks cover the triple actually being shipped.
      - name: Rust checks
        working-directory: src-tauri
        run: |
          cargo test --target ${{ matrix.target }}
          cargo clippy --target ${{ matrix.target }} --all-targets -- -D warnings

      # Flathub's org.flatpak.Builder, not the distro flatpak-builder: 22.04's
      # is old enough to invoke `appstream-compose`, which current SDKs no
      # longer ship, and the build then dies after compiling everything.
      - name: Install Flatpak toolchain
        if: runner.os == 'Linux'
        run: |
          # dbus-run-session: `flatpak run` needs a session bus to resolve the
          # SDK and a hosted runner has none. flatpak-builder: kept as a
          # fallback so the Flatpak step still has a builder if the Flathub
          # install fails.
          sudo apt-get install -y flatpak flatpak-builder dbus
          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub org.flatpak.Builder

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No APPLE_* signing variables here on purpose. An unset secret
          # expands to the empty string rather than being absent, and Tauri
          # treats a defined-but-empty APPLE_CERTIFICATE as "signing requested":
          # it ran `security import` on an empty certificate and failed the
          # bundle step after a clean four-minute build. macOS artifacts are
          # therefore unsigned and unnotarised, and users must right-click ->
          # Open on first launch (README says so).
          #
          # To enable signing later, add the secrets AND re-add the env keys in
          # the same commit - adding the keys alone reintroduces this failure.
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: 'TeX Viewer __VERSION__'
          releaseBody: |
            Installers for macOS, Windows and Linux.

            A Tectonic LaTeX engine is bundled, so PDF compilation works on a
            fresh install with no separate TeX distribution. An existing
            pdflatex/xelatex/lualatex is preferred when one is present.

            The first PDF compile with the bundled engine downloads the support
            files it needs and caches them; later compiles are offline.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false
          args: ${{ matrix.args }}

      # Runs after tauri-action so the .deb it packages already exists. The
      # Flatpak wraps that same .deb rather than rebuilding, so it cannot drift
      # from the other Linux installers.
      - name: Build Flatpak bundle
        if: runner.os == 'Linux'
        run: ./scripts/build-flatpak.sh --no-install

      - name: Upload installers as build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.target }}
          if-no-files-found: warn
          path: |
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
            target/*.flatpak
