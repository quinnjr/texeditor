name: Release

# Installers for macOS, Windows and Linux cannot be cross-compiled from one
# host — each needs its own runner — so tagging is what produces a full set.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build the installers but do not publish a release'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ''
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # 22.04 rather than 24.04: the deb it produces links against the older
      # glibc/webkit, so it installs on both. Building on 24.04 would silently
      # drop support for every 22.04 user.
      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf file rpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.target }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Fetch the engine for the target we are actually building, not the host —
      # they differ for the macOS cross-builds.
      - name: Fetch bundled Tectonic engine
        run: node scripts/fetch-tectonic.mjs --target ${{ matrix.target }}

      - name: Verify the third-party notice is current
        shell: bash
        run: |
          node scripts/gen-third-party.mjs
          if ! git diff --quiet -- THIRD-PARTY-LICENSES.md; then
            echo "::error::THIRD-PARTY-LICENSES.md is stale. Run 'pnpm licenses' and commit the result."
            git diff -- THIRD-PARTY-LICENSES.md | head -60
            exit 1
          fi

      - run: pnpm test
      - run: pnpm exec svelte-check --threshold error
      - name: Rust checks
        working-directory: src-tauri
        run: |
          cargo test
          cargo clippy --all-targets -- -D warnings

      - name: Install Flatpak toolchain
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Both are optional. Without them macOS builds are unsigned and
          # unnotarised, and users must right-click -> Open on first launch;
          # the build still succeeds.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: 'TeX Viewer __VERSION__'
          releaseBody: |
            Installers for macOS, Windows and Linux.

            A Tectonic LaTeX engine is bundled, so PDF compilation works on a
            fresh install with no separate TeX distribution. An existing
            pdflatex/xelatex/lualatex is preferred when one is present.

            The first PDF compile with the bundled engine downloads the support
            files it needs and caches them; later compiles are offline.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false
          args: ${{ matrix.args }}

      # Runs after tauri-action so the .deb it packages already exists. The
      # Flatpak wraps that same .deb rather than rebuilding, so it cannot drift
      # from the other Linux installers.
      - name: Build Flatpak bundle
        if: matrix.platform == 'ubuntu-22.04'
        run: ./scripts/build-flatpak.sh --no-install

      - name: Upload installers as build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.target }}
          if-no-files-found: warn
          path: |
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
            target/*.flatpak
