name: CI

# The checks here are repo-level invariants, not per-platform packaging, so
# they belong on every push and pull request rather than only at tag time.
# Before this existed, `release.yml` was the only workflow and fired only on
# `v*` tags: the first sign that the licence notice had gone stale, or that a
# test had broken, was a failed release with the tag already pushed.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # tauri-build resolves the sidecar path at compile time, so the Rust
      # checks below need the binary present even though nothing is bundled.
      - name: Fetch bundled Tectonic engine
        run: node scripts/fetch-tectonic.mjs

      - name: Verify the third-party notice is current
        run: |
          node scripts/gen-third-party.mjs
          if ! git diff --quiet -- THIRD-PARTY-LICENSES.md; then
            echo "::error::THIRD-PARTY-LICENSES.md is stale. Run 'pnpm run licenses' and commit the result."
            git diff -- THIRD-PARTY-LICENSES.md | head -60
            exit 1
          fi

      - run: pnpm test
      - run: pnpm exec svelte-check --threshold error

      - name: Rust checks
        working-directory: src-tauri
        run: |
          cargo test
          cargo clippy --all-targets -- -D warnings

      - name: Shell scripts parse
        run: bash -n scripts/build-flatpak.sh

  # A real macOS runner, not a cross-check from Linux: objc2's build script
  # needs a compiler that accepts `-arch`, so `cargo clippy --target
  # *-apple-darwin` on ubuntu fails in a way that says nothing about the code.
  # This job exists because the macOS release leg has now broken twice on
  # problems no Linux job can see - dead code that only exists off Linux, and
  # a host/target triple mismatch.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The host triple, because these checks are untargeted - the same
      # mismatch that broke the release's x86_64 leg.
      - name: Fetch bundled Tectonic engine
        run: node scripts/fetch-tectonic.mjs

      - name: Rust checks
        working-directory: src-tauri
        run: |
          cargo test
          cargo clippy --all-targets -- -D warnings
