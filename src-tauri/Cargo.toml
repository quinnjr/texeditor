[package]
name = "tex-viewer"
version = "0.1.0"
description = "TeX Viewer"
authors = ["joseph"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "tex_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

# Landlock confines each LaTeX engine process to the TeX installation, the
# document's own directory and a scratch directory. See src/sandbox.rs.
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
